name: Tag image as prod
run-name: Tag image as prod (${{ inputs.source_tag }} → prod-${{ inputs.bid }})
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing image tag to promote (e.g. main-27018200206)'
        type: string
        required: true
      bid:
        description: 'Hex build id for the prod- tag (e.g. git sha or run id)'
        type: string
        required: true
jobs:
  Tag-Prod:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}_static_py
    steps:
      - run: echo "🏷️ Promoting ${{ inputs.source_tag }} to prod-${{ inputs.bid }}."
      - name: Log in to Github
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane
        uses: imjasonh/setup-crane@v0.3
      - name: Tag image as prod
        run: |
          crane tag ${IMAGE_REPO}:${{ inputs.source_tag }} prod-${{ inputs.bid }}