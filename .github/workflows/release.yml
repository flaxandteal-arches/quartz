name: Tag image as prod
run-name: Tag image as prod (${{ inputs.source_tag }} → prod-${{ inputs.bid }})
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing image tag to promote (e.g. main-8234567)'
        type: string
        required: true
      bid:
        description: 'Hex build id for the prod- tag (e.g. git sha)'
        type: string
        required: true
jobs:
  Tag-Prod:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}_static_py
    steps:
      - run: echo "🏷️ Promoting ${{ inputs.source_tag }} to prod-${{ inputs.bid }}."
      - name: Log in to Github
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest
      - name: Tag image as prod
        run: |
          docker buildx imagetools create \
            -t ${IMAGE_REPO}:prod-${{ inputs.bid }} \
            ${IMAGE_REPO}:${{ inputs.source_tag }}